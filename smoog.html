<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smoog AI</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5faf5;
    color: #222;
}

header {
    background: #168c45;
    color: white;
    padding: 18px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header a {
    color: white;
    text-decoration: none;
}

main {
    max-width: 750px;
    margin: 35px auto;
    padding: 15px;
}

h1 {
    color: #168c45;
    text-align: center;
}

#chat {
    background: white;
    border-radius: 12px;
    padding: 20px;
    min-height: 350px;
    box-shadow: 0 2px 10px #ddd;
}

.message {
    padding: 12px 16px;
    margin: 12px 0;
    border-radius: 12px;
    max-width: 80%;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
}

.user {
    background: #d9f5df;
    margin-left: auto;
}

.bot {
    background: #eeeeee;
    margin-right: auto;
}

form {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

input {
    flex: 1;
    padding: 14px;
    border: 2px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
}

button {
    background: #168c45;
    color: white;
    border: none;
    padding: 13px 20px;
    border-radius: 10px;
    cursor: pointer;
}

button:hover {
    background: #106b34;
}

#clear {
    background: #777;
    margin-top: 15px;
}
</style>
</head>

<body>

<header>
    <strong>🟢 Smoog</strong>
    <a href="index.html">Back to Smoogle</a>
</header>

<main>
    <h1>Smoog AI</h1>
    <p style="text-align:center;">Your personal AI assistant.</p>

    <div id="chat"></div>

    <form id="form">
        <input id="input" placeholder="Message Smoog..." autocomplete="off">
        <button type="submit">Send</button>
    </form>

    <button id="clear">Clear chat history</button>
</main>

<script>
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");

let messages = JSON.parse(localStorage.getItem("smoogHistory") || "[]");

function save() {
    localStorage.setItem("smoogHistory", JSON.stringify(messages));
}

function displayMessage(message, sender) {
    const bubble = document.createElement("div");
    bubble.className = "message " + sender;
    bubble.textContent = message;
    chat.appendChild(bubble);
    chat.scrollTop = chat.scrollHeight;
}

function loadChat() {
    chat.innerHTML = "";

    if (messages.length === 0) {
        displayMessage("Hey! I'm Smoog. What can I help you with?", "bot");
        return;
    }

    messages.forEach(message => {
        displayMessage(message.text, message.sender);
    });
}

form.addEventListener("submit", function(event) {
    event.preventDefault();

    const text = input.value.trim();
    if (!text) return;

    messages.push({
        text: text,
        sender: "user"
    });

    displayMessage(text, "user");
    input.value = "";

    const reply = "I'm still getting my AI brain connected! I'll be able to answer questions properly soon.";

    messages.push({
        text: reply,
        sender: "bot"
    });

    displayMessage(reply, "bot");
    save();
});

document.getElementById("clear").addEventListener("click", function() {
    if (confirm("Are you sure you want to clear your chat history?")) {
        messages = [];
        save();
        loadChat();
    }
});

loadChat();
</script>

</body>
</html>
