<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smoog AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5fff5;
    color: #183d22;
    transition: 0.3s;
}

header {
    background: #269b43;
    color: white;
    padding: 18px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header a {
    color: white;
    text-decoration: none;
    font-weight: bold;
}

.header-buttons {
    display: flex;
    gap: 10px;
}

main {
    max-width: 850px;
    margin: 35px auto;
    padding: 15px;
}

h1 {
    text-align: center;
    color: #269b43;
}

.subtitle {
    text-align: center;
    color: #63816a;
}

#chat {
    background: white;
    border-radius: 15px;
    padding: 20px;
    min-height: 400px;
    max-height: 55vh;
    overflow-y: auto;
    box-shadow: 0 2px 10px #ddd;
    margin-top: 25px;
}

.message {
    padding: 12px 16px;
    margin: 12px 0;
    border-radius: 12px;
    max-width: 80%;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
}

.user {
    background: #d9f5df;
    margin-left: auto;
}

.bot {
    background: #eeeeee;
    margin-right: auto;
}

form {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

input {
    flex: 1;
    min-width: 0;
    padding: 14px;
    border: 2px solid #b8dfbd;
    border-radius: 25px;
    font-size: 16px;
    background: white;
    color: #183d22;
}

button {
    background: #269b43;
    color: white;
    border: none;
    padding: 13px 20px;
    border-radius: 25px;
    cursor: pointer;
}

button:hover {
    background: #187a32;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

#clear {
    background: #777;
}

#clear:hover {
    background: #555;
}

/* DARK MODE */

body.dark {
    background: #121b15;
    color: #e5f5e8;
}

body.dark h1 {
    color: #55d477;
}

body.dark .subtitle {
    color: #a0b9a5;
}

body.dark #chat {
    background: #202d24;
    box-shadow: 0 2px 10px #0005;
}

body.dark .user {
    background: #285b37;
    color: white;
}

body.dark .bot {
    background: #344239;
    color: white;
}

body.dark input {
    background: #202d24;
    border-color: #41694b;
    color: white;
}

body.dark input::placeholder {
    color: #a0b9a5;
}

@media (max-width: 600px) {
    header {
        flex-wrap: wrap;
        gap: 12px;
    }

    main {
        margin: 15px auto;
    }

    form {
        flex-wrap: wrap;
    }
}
</style>
</head>

<body>

<header>
    <a href="index.html">🟢 Smoog</a>

    <div class="header-buttons">
        <button id="themeToggle" onclick="toggleTheme()">🌙 Dark mode</button>
        <button id="clear" onclick="newChat()">＋ New Chat</button>
    </div>
</header>

<main>

    <h1>Smoog AI</h1>
    <p class="subtitle">Your personal AI assistant.</p>

    <div id="chat"></div>

    <form id="form">
        <input
            id="input"
            placeholder="Message Smoog..."
            autocomplete="off"
        >
        <button id="sendButton" type="submit">Send</button>
    </form>

</main>

<script>

const API_URL = "https://smoog-backend.jasonmsinternet.workers.dev";

const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");
const sendButton = document.getElementById("sendButton");

let messages = JSON.parse(
    localStorage.getItem("smoogHistory") || "[]"
);

function save() {
    localStorage.setItem(
        "smoogHistory",
        JSON.stringify(messages)
    );
}

function displayMessage(message, sender) {
    const bubble = document.createElement("div");

    bubble.className = "message " + sender;
    bubble.textContent = message;

    chat.appendChild(bubble);
    chat.scrollTop = chat.scrollHeight;

    return bubble;
}

function loadChat() {
    chat.innerHTML = "";

    if (messages.length === 0) {
        displayMessage(
            "Hey! I'm Smoog. What can I help you with?",
            "bot"
        );
        return;
    }

    messages.forEach(message => {
        displayMessage(message.text, message.sender);
    });
}

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const text = input.value.trim();

    if (!text || sendButton.disabled) return;

    const previousMessages = messages.slice();

    messages.push({
        text: text,
        sender: "user"
    });

    displayMessage(text, "user");

    input.value = "";
    sendButton.disabled = true;
    sendButton.textContent = "Thinking...";

    const loadingBubble = displayMessage(
        "Smoog is thinking...",
        "bot"
    );

    try {
        const history = previousMessages
            .filter(message =>
                message.sender === "user" ||
                message.sender === "bot"
            )
            .slice(-10)
            .map(message => ({
                role: message.sender === "user"
                    ? "user"
                    : "assistant",
                content: message.text
            }));

        const response = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: text,
                history: history
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "The AI service returned an error.");
        }

        if (!data.reply) {
            throw new Error("Smoog returned an empty response.");
        }

        loadingBubble.textContent = data.reply;

        messages.push({
            text: data.reply,
            sender: "bot"
        });

    } catch (error) {
        console.error("Smoog error:", error);

        const errorMessage =
            "Sorry! I couldn't connect to my AI brain. Please try again.";

        loadingBubble.textContent = errorMessage;

        messages.push({
            text: errorMessage,
            sender: "bot"
        });

    } finally {
        save();
        sendButton.disabled = false;
        sendButton.textContent = "Send";
        input.focus();
    }
});

function newChat() {
    if (!confirm("Start a new chat? Your previous chat will be cleared.")) {
        return;
    }

    messages = [];
    save();
    loadChat();
}

/* DARK MODE */

function toggleTheme() {
    document.body.classList.toggle("dark");

    const dark = document.body.classList.contains("dark");

    localStorage.setItem(
        "smoogleTheme",
        dark ? "dark" : "light"
    );

    updateButton();
}

function updateButton() {
    const dark = document.body.classList.contains("dark");

    document.getElementById("themeToggle").textContent =
        dark ? "☀️ Light mode" : "🌙 Dark mode";
}

if (localStorage.getItem("smoogleTheme") === "dark") {
    document.body.classList.add("dark");
}

updateButton();
loadChat();

</script>

</body>
</html>
