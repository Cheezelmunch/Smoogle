```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search Results - Smoogle</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f7fff7;
    color: #183d22;
}

header {
    display: flex;
    align-items: center;
    gap: 35px;
    padding: 22px 6%;
    border-bottom: 1px solid #dcebdc;
    background: white;
}

.logo {
    font-size: 30px;
    font-weight: bold;
    color: #269b43;
    text-decoration: none;
}

form {
    display: flex;
    width: min(600px, 70%);
    border: 2px solid #b8dfbd;
    border-radius: 30px;
    padding: 6px 10px;
}

input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 16px;
    padding: 10px;
    min-width: 0;
}

button {
    background: #269b43;
    color: white;
    border: none;
    border-radius: 25px;
    padding: 11px 20px;
    cursor: pointer;
    font-size: 15px;
}

button:hover {
    background: #187a32;
}

main {
    max-width: 750px;
    margin: 35px 8%;
}

#query {
    color: #63816a;
    font-size: 14px;
}

.result {
    margin: 30px 0;
}

.result a {
    color: #18843a;
    font-size: 21px;
    text-decoration: none;
}

.result a:hover {
    text-decoration: underline;
}

.url {
    color: #578365;
    font-size: 13px;
    margin: 7px 0;
}

.description {
    color: #435c48;
    line-height: 1.5;
}

#message {
    color: #63816a;
    margin-top: 35px;
}

@media(max-width: 600px) {
    header {
        flex-wrap: wrap;
        gap: 15px;
    }

    form {
        width: 100%;
    }

    main {
        margin: 25px 6%;
    }
}
</style>
</head>

<body>

<header>
    <a href="index.html" class="logo">Smoogle</a>

    <form id="searchForm">
        <input id="searchInput" name="q" placeholder="Search Smoogle..." required>
        <button type="submit">Search</button>
    </form>
</header>

<main>
    <p id="query"></p>

    <div id="results"></div>

    <p id="message"></p>
</main>

<script>
const params = new URLSearchParams(window.location.search);
const search = params.get("q") || "";

document.getElementById("searchInput").value = search;
document.getElementById("query").textContent =
    search ? 'Search results for "' + search + '"' : "Welcome to Smoogle";

document.getElementById("searchForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const value = document.getElementById("searchInput").value.trim();

    if (value) {
        window.location.href = "results.html?q=" + encodeURIComponent(value);
    }
});

document.getElementById("message").textContent = search
    ? "Smoogle is ready to search. We're connecting Exa next!"
    : "Enter something above to get started.";
</script>

</body>
</html>
