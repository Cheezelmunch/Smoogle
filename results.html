<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smoogle Search</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5fff5;
    color: #183d22;
    transition: 0.3s;
}

header {
    padding: 20px 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #d5ead8;
}

.logo {
    font-size: 27px;
    font-weight: bold;
    color: #269b43;
    text-decoration: none;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 12px;
}

button {
    background: #269b43;
    color: white;
    border: none;
    padding: 12px 18px;
    border-radius: 25px;
    cursor: pointer;
    font-size: 14px;
}

button:hover {
    background: #187a32;
}

.search-box {
    display: flex;
    max-width: 650px;
    flex: 1;
    margin: 0 25px;
    padding: 7px 12px;
    background: white;
    border: 2px solid #b8dfbd;
    border-radius: 30px;
}

input {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    padding: 10px;
    font-size: 16px;
    background: transparent;
    color: inherit;
}

.tabs {
    display: flex;
    gap: 30px;
    padding: 20px 40px;
    border-bottom: 1px solid #d5ead8;
}

.tab {
    color: #63816a;
    text-decoration: none;
    padding-bottom: 10px;
}

.tab.active {
    color: #269b43;
    border-bottom: 3px solid #269b43;
    font-weight: bold;
}

main {
    max-width: 850px;
    margin: 30px 40px;
}

.result-info {
    color: #78917c;
    margin-bottom: 25px;
}

.ai-card {
    background: #e7f8e9;
    border: 1px solid #b8dfbd;
    padding: 22px;
    border-radius: 15px;
    margin-bottom: 30px;
}

.ai-card h2 {
    color: #269b43;
    margin-top: 0;
}

.placeholder {
    background: white;
    border: 1px solid #d5ead8;
    padding: 25px;
    border-radius: 12px;
    margin-bottom: 20px;
}

.placeholder h3 {
    color: #269b43;
}

.placeholder p {
    color: #63816a;
}

.ai-button {
    display: inline-block;
    background: #174d2a;
    color: white;
    text-decoration: none;
    padding: 11px 20px;
    border-radius: 25px;
}

.ai-button:hover {
    background: #269b43;
}

/* DARK MODE */

body.dark {
    background: #121b15;
    color: #e5f5e8;
}

body.dark header,
body.dark .tabs {
    border-color: #304c36;
}

body.dark .search-box,
body.dark .placeholder {
    background: #202d24;
    border-color: #41694b;
}

body.dark input {
    color: white;
}

body.dark input::placeholder {
    color: #a0b9a5;
}

body.dark .tab {
    color: #a0b9a5;
}

body.dark .tab.active {
    color: #55d477;
    border-color: #55d477;
}

body.dark .ai-card {
    background: #1d3323;
    border-color: #41694b;
}

body.dark .ai-card h2,
body.dark .placeholder h3 {
    color: #55d477;
}

body.dark .placeholder p,
body.dark .result-info {
    color: #a0b9a5;
}

body.dark .logo {
    color: #55d477;
}

body.dark .ai-button {
    background: #286c3c;
}

@media (max-width: 650px) {
    header {
        flex-wrap: wrap;
        gap: 15px;
    }

    .search-box {
        order: 3;
        flex-basis: 100%;
        margin: 0;
    }

    .tabs {
        padding: 15px;
        gap: 18px;
        overflow-x: auto;
    }

    main {
        margin: 25px 15px;
    }
}
</style>
</head>

<body>

<header>
    <a href="index.html" class="logo">🟢 Smoogle</a>

    <form action="results.html" method="GET" class="search-box">
        <input id="searchInput" name="q"
        placeholder="Search Smoogle..." required>
        <button type="submit">Search</button>
    </form>

    <div class="header-right">
        <button id="themeToggle" onclick="toggleTheme()">
            🌙 Dark mode
        </button>
    </div>
</header>

<nav class="tabs">
    <a href="results.html" class="tab" data-type="all">All</a>
    <a href="results.html?type=images" class="tab" data-type="images">Images</a>
    <a href="results.html?type=news" class="tab" data-type="news">News</a>
    <a href="results.html?type=videos" class="tab" data-type="videos">Videos</a>
    <a href="results.html?type=ai" class="tab" data-type="ai">AI</a>
</nav>

<main>

    <p class="result-info" id="resultInfo"></p>

    <section class="ai-card">
        <h2>✨ Ask Smoog</h2>
        <p>
            Want an AI-powered answer to your search?
            Ask Smoog!
        </p>
        <a href="smoog.html" class="ai-button">
            Ask Smoog AI →
        </a>
    </section>

    <section class="placeholder">
        <h3>Welcome to Smoogle!</h3>
        <p>
            Your search engine is being built.
            Real internet search results will appear here
            once we connect a search provider.
        </p>
    </section>

</main>

<script>

/* SEARCH QUERY */

const params = new URLSearchParams(window.location.search);
const query = params.get("q") || "";
const type = params.get("type") || "all";

document.getElementById("searchInput").value = query;

document.getElementById("resultInfo").textContent =
    query ? 'Search results for "' + query + '"' : "Explore Smoogle";

/* TABS */

document.querySelectorAll(".tab").forEach(tab => {
    if (tab.dataset.type === type) {
        tab.classList.add("active");
    }

    tab.addEventListener("click", function(event) {
        event.preventDefault();

        const newParams = new URLSearchParams();
        if (query) newParams.set("q", query);
        if (tab.dataset.type !== "all") {
            newParams.set("type", tab.dataset.type);
        }

        window.location.href =
            "results.html?" + newParams.toString();
    });
});

/* DARK MODE */

function updateButton() {
    const dark = document.body.classList.contains("dark");

    document.getElementById("themeToggle").textContent =
        dark ? "☀️ Light mode" : "🌙 Dark mode";
}

function toggleTheme() {
    document.body.classList.toggle("dark");

    localStorage.setItem(
        "smoogleTheme",
        document.body.classList.contains("dark") ? "dark" : "light"
    );

    updateButton();
}

if (localStorage.getItem("smoogleTheme") === "dark") {
    document.body.classList.add("dark");
}

updateButton();

</script>

</body>
</html>
