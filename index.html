<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smoogle</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5fff5;
    color: #183d22;
    transition: 0.3s;
}

header {
    padding: 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 30px;
    font-weight: bold;
    color: #269b43;
    text-decoration: none;
}

main {
    margin-top: 130px;
    padding: 20px;
    text-align: center;
}

h1 {
    font-size: 75px;
    color: #269b43;
    margin-bottom: 10px;
}

.subtitle {
    color: #63816a;
    margin-bottom: 35px;
}

.search-box {
    display: flex;
    max-width: 600px;
    margin: auto;
    background: white;
    border: 2px solid #b8dfbd;
    border-radius: 30px;
    padding: 8px 15px;
}

input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 17px;
    padding: 10px;
    min-width: 0;
    background: transparent;
    color: inherit;
}

button {
    background: #269b43;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 25px;
    cursor: pointer;
    font-size: 15px;
}

button:hover {
    background: #187a32;
}

.ai-button {
    display: inline-block;
    margin-top: 25px;
    background: #174d2a;
    color: white;
    padding: 14px 28px;
    border-radius: 25px;
    text-decoration: none;
    font-size: 16px;
}

.ai-button:hover {
    background: #269b43;
}

#themeToggle {
    background: #269b43;
    border-radius: 25px;
    padding: 12px 18px;
}

footer {
    position: fixed;
    bottom: 0;
    width: 100%;
    padding: 20px;
    color: #78917c;
    font-size: 13px;
    text-align: center;
}

/* DARK MODE */

body.dark {
    background: #121b15;
    color: #e5f5e8;
}

body.dark h1 {
    color: #55d477;
}

body.dark .logo {
    color: #55d477;
}

body.dark .subtitle {
    color: #a0b9a5;
}

body.dark .search-box {
    background: #202d24;
    border-color: #41694b;
}

body.dark input {
    color: white;
}

body.dark input::placeholder {
    color: #a0b9a5;
}

body.dark .ai-button {
    background: #286c3c;
}

body.dark footer {
    color: #849989;
}

</style>
</head>

<body>

<header>
    <a href="index.html" class="logo">🟢 Smoogle</a>

    <button id="themeToggle" onclick="toggleTheme()">
        🌙 Dark mode
    </button>
</header>

<main>

    <h1>Smoogle</h1>

    <p class="subtitle">
        Search smarter. Discover more.
    </p>

    <form action="results.html" method="GET" class="search-box">

        <input
            type="text"
            name="q"
            placeholder="Search the web..."
            required
        >

        <button type="submit">
            Search
        </button>

    </form>

    <a href="smoog.html" class="ai-button">
        ✨ Ask Smoog AI
    </a>

</main>

<footer>
    © 2026 Smoogle | Powered by curiosity.
</footer>

<script>

function toggleTheme() {
    document.body.classList.toggle("dark");

    const isDark = document.body.classList.contains("dark");

    localStorage.setItem("smoogleTheme", isDark ? "dark" : "light");

    updateButton();
}

function updateButton() {
    const isDark = document.body.classList.contains("dark");

    document.getElementById("themeToggle").textContent =
        isDark ? "☀️ Light mode" : "🌙 Dark mode";
}

if (localStorage.getItem("smoogleTheme") === "dark") {
    document.body.classList.add("dark");
}

updateButton();

</script>

</body>
</html>
