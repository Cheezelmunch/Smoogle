<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smoogle</title>

<style>

/* GENERAL */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5fff5;
    color: #183d22;
}

/* HEADER */

header {
    padding: 25px;
    text-align: left;
}

.logo {
    font-size: 30px;
    font-weight: bold;
    color: #269b43;
    text-decoration: none;
}

/* MAIN CONTENT */

main {
    margin-top: 130px;
    padding: 20px;
    text-align: center;
}

h1 {
    font-size: 75px;
    color: #269b43;
    margin-bottom: 10px;
}

.subtitle {
    color: #63816a;
    margin-bottom: 35px;
    font-size: 17px;
}

/* SEARCH BAR */

.search-box {
    display: flex;
    max-width: 600px;
    margin: auto;
    background: white;
    border: 2px solid #b8dfbd;
    border-radius: 30px;
    padding: 8px 15px;
    transition: 0.2s;
}

.search-box:focus-within {
    border-color: #269b43;
    box-shadow: 0 0 10px #269b4330;
}

input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 17px;
    padding: 10px;
    min-width: 0;
}

/* BUTTONS */

button {
    background: #269b43;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 25px;
    cursor: pointer;
    font-size: 15px;
    transition: 0.2s;
}

button:hover {
    background: #187a32;
    transform: scale(1.04);
}

/* SMOOG BUTTON */

.ai-button {
    display: inline-block;
    margin-top: 25px;
    background: #174d2a;
    color: white;
    padding: 14px 28px;
    border-radius: 25px;
    text-decoration: none;
    font-size: 16px;
    transition: 0.2s;
}

.ai-button:hover {
    background: #269b43;
    transform: scale(1.05);
}

/* FOOTER */

footer {
    position: fixed;
    bottom: 0;
    width: 100%;
    padding: 20px;
    color: #78917c;
    font-size: 13px;
    text-align: center;
}

</style>
</head>

<body>

<header>
    <a href="index.html" class="logo">🟢 Smoogle</a>
</header>

<main>

    <h1>Smoogle</h1>

    <p class="subtitle">
        Search smarter. Discover more.
    </p>

    <!-- SEARCH -->

    <form action="results.html" method="GET" class="search-box">

        <input
            type="text"
            name="q"
            placeholder="Search the web..."
            required
        >

        <button type="submit">
            Search
        </button>

    </form>

    <!-- SMOOG AI -->

    <a href="smoog.html" class="ai-button">
        ✨ Ask Smoog AI
    </a>

</main>

<footer>
    © 2026 Smoogle | Powered by curiosity.
</footer>

</body>
</html>
